name: verify

# Daily at 07:00 IST (01:30 UTC), when yesterday's last reports are in:
#   1. verify.py scores yesterday's forecasts of ten models and the Blend against the South Indian airports' reports;
#   2. verify_gauges.py scores their rain against the Tamil Nadu rain gauges (the rain day that ended at 08:30 IST yesterday);
#   3. learn_bias.py learns each model's usual error, rain thresholds and the Blend weights from the last four weeks, checked on held-back days.
# Then it commits the scores and corrections the app reads (public/data/verification), the days learned from (pipeline/data/verification)
# and the map's ECMWF IFS correction (pipeline/data/bias/table.json, used by the next nwp run). It can also be run by hand for a given day.
#
# The free services sometimes refuse a GitHub runner (Open-Meteo counts its free allowance per address, and runners share addresses), so
# it is tried again at 11:00 and 16:00 IST; scoring a day again only replaces its scores. Each step goes on when one before it fails, and
# the run is marked failed at the end with the reason as an annotation (shown on the run's page).
on:
  schedule:
    - cron: "30 1 * * *"
    - cron: "30 5 * * *"
    - cron: "30 10 * * *"
  # a change to the scoring runs it at once (the bot's own commits do not start workflows, so this does not loop)
  push:
    branches: [main]
    paths:
      - "pipeline/verify.py"
      - "pipeline/verify_gauges.py"
      - "pipeline/learn_bias.py"
      - "pipeline/blend.py"
      - ".github/workflows/verify.yml"
  workflow_dispatch:
    inputs:
      day:
        description: "UTC day to score, YYYY-MM-DD (empty: yesterday)"
        required: false
        default: ""

concurrency:
  group: verify
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pytest
      - run: python -m pytest -q tests/test_verify.py tests/test_verify_gauges.py tests/test_blend.py tests/test_learn_bias.py
        working-directory: pipeline
      - name: Score at the airports
        id: airports
        working-directory: pipeline
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.day }}" ]; then
            python verify.py --out ../public/data/verification/scores.json --day "${{ github.event.inputs.day }}"
          else
            python verify.py --out ../public/data/verification/scores.json
          fi
      - name: Score rain at the gauges
        id: gauges
        working-directory: pipeline
        continue-on-error: true
        run: python verify_gauges.py --out ../public/data/verification/scores.json
      - name: Learn corrections and the Blend
        id: learn
        working-directory: pipeline
        continue-on-error: true
        run: python learn_bias.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/verification pipeline/data/verification pipeline/data/bias/table.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Verification: forecast scores, corrections and Blend weights, $(date -u -d yesterday +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 10; done
      - name: Fail when a step failed
        if: steps.airports.outcome == 'failure' || steps.gauges.outcome == 'failure' || steps.learn.outcome == 'failure'
        run: |
          echo "::error title=verify::airports ${{ steps.airports.outcome }}, gauges ${{ steps.gauges.outcome }}, learning ${{ steps.learn.outcome }} (the reasons are in the annotations above)"
          exit 1
