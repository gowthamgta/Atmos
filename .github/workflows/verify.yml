name: verify

# Scores yesterday's forecasts of each model against the South Indian airports' reports (pipeline/verify.py) and commits the rolling file
# the app reads (public/data/verification/scores.json, the last 90 days). Daily at 07:00 IST (01:30 UTC), when yesterday's last reports
# are in; it can also be run by hand for a given day (the airport reports go back about two weeks).
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "UTC day to score, YYYY-MM-DD (empty: yesterday)"
        required: false
        default: ""

concurrency:
  group: verify
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pytest
      - run: python -m pytest -q tests/test_verify.py
        working-directory: pipeline
      - name: Score
        working-directory: pipeline
        run: |
          if [ -n "${{ github.event.inputs.day }}" ]; then
            python verify.py --out ../public/data/verification/scores.json --day "${{ github.event.inputs.day }}"
          else
            python verify.py --out ../public/data/verification/scores.json
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/verification/scores.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Verification: forecast scores at the airports, $(date -u -d yesterday +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 10; done
