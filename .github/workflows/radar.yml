name: radar

# Fetches all IMD Doppler Weather Radars across India (45 stations),
# composites them into a unified georeferenced All-India radar picture (PNG and animated GIF),
# and commits the updated data to the website repository (public/data/radar/).
# Runs every 10 minutes (via GitHub schedule or outside cron dispatch from cron-job.org).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild"
        type: boolean
        default: false

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-radar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install numpy pillow requests

      - name: Ingest and composite All-India radars
        run: python pipeline/radar_india.py --out public/data/radar

      - name: Commit and push radar updates to website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/radar
          if git diff --cached --quiet; then
            echo "No changes in radar scans; nothing to commit."
            exit 0
          fi
          git commit -m "Radar: all-India mosaic update, $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 10
          done
