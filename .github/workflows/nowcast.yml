name: nowcast

# The radar sampler (bot/README.md): opens the live radar of the app in a headless browser and keeps the radar and its 30 and 60 minute
# nowcast over the Tamil Nadu gauge cells, for the daily verification (verify workflow). It posts nothing: the nowcast bot that posted storms
# to Telegram, Discord and X was removed (the owner, 1 Nov 2026). The file keeps its name, so cron-job.org starts it as before
# (pipeline/README.md); GitHub's own schedule is not used (it ran late or not at all).
on:
  workflow_dispatch:
    inputs:
      # cron-job.org still sends it; GitHub refuses a start with an input the workflow does not declare
      as_schedule:
        description: "Started by an outside scheduler such as cron-job.org (no effect now)"
        type: boolean
        default: false

concurrency:
  group: nowcast
  cancel-in-progress: false

jobs:
  samples:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      - name: Browser
        run: npx playwright install --with-deps chromium
      - run: npm test
      # the radar over the gauge cells, kept for the daily verification (verify workflow); the newest store, saved once an hour below
      - uses: actions/cache/restore@v6
        with:
          path: bot/samples
          key: radar-samples-latest
          restore-keys: radar-samples-
      - name: Radar samples
        run: node sample.mjs
      - name: Hour of the samples
        id: hour
        if: always()
        run: echo "key=radar-samples-$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"
      # once an hour: a key already taken this hour is refused, harmlessly
      - uses: actions/cache/save@v6
        if: always() && hashFiles('bot/samples/radar-samples.json') != ''
        continue-on-error: true
        with:
          path: bot/samples
          key: ${{ steps.hour.outputs.key }}
