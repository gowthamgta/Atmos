name: nowcast

# The nowcast bot (bot/README.md): every ten minutes it opens the live radar of the app in a headless browser, and when there are storms
# over Tamil Nadu or Puducherry posts the radar picture with a short alert to the Telegram channel, the Discord server and X (each once its keys are set
# as repository secrets). Until then, and until the variable NOWCAST_LIVE is "true", it only dry-runs: each run's picture and the post it
# would make are kept as the run's artifact, to look at first.
#
# Each look also keeps the newest satellite frame against the radar at its time (bot/pairs.mjs), for learning the synthetic radar
# (pipeline/learn_rain.py, run by the verify workflow): one small gzipped file a frame, committed to the rain-pairs branch, never to main.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Decide and keep the picture and the post as the run's artifact, but do not post"
        type: boolean
        default: true
      force:
        description: "Post (or dry-run) even with no storm, or a recent post: to try the whole chain"
        type: boolean
        default: false

# one run at a time, and a run that starts while another is still going waits rather than both posting
concurrency:
  group: nowcast
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  nowcast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      - name: Browser
        run: npx playwright install --with-deps chromium
      - run: npm test
      # the pairs kept so far: the rain-pairs branch as a worktree (made empty the first time)
      - name: Pairs branch
        working-directory: .
        run: |
          if git fetch --depth=1 origin rain-pairs; then
            git worktree add -B rain-pairs rain-pairs-data FETCH_HEAD
          else
            git worktree add --orphan -b rain-pairs rain-pairs-data
          fi
      # what the last post was (so a storm is not posted again every ten minutes): kept between runs in the cache, the newest entry
      - uses: actions/cache/restore@v6
        with:
          path: bot/state
          key: nowcast-state-latest
          restore-keys: nowcast-state-
      # the radar over the gauge cells, kept for the daily verification (verify workflow); the newest store, saved once an hour below
      - uses: actions/cache/restore@v6
        with:
          path: bot/samples
          key: radar-samples-latest
          restore-keys: radar-samples-
      - name: Nowcast
        env:
          ALERT_PLACES: ${{ vars.ALERT_PLACES }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || '@tnweatheralerts' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          # a scheduled run posts once the keys are set (and NOWCAST_LIVE is "true", a switch to stop it without removing them);
          # a run started by hand posts only when asked
          DRY_RUN: ${{ ((github.event_name == 'schedule' && vars.NOWCAST_LIVE == 'true') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) && '0' || '1' }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          INCLUDE_LINK: ${{ vars.NOWCAST_INCLUDE_LINK == 'true' && '1' || '0' }}
          PAIRS_DIR: ${{ github.workspace }}/rain-pairs-data
        run: node nowcast.mjs
      # committed in the worktree, pushed from the main checkout (its credentials)
      - name: Keep the pairs
        if: always()
        working-directory: .
        run: |
          [ -d rain-pairs-data ] || exit 0
          git -C rain-pairs-data add -A
          if git -C rain-pairs-data diff --cached --quiet; then echo "no new pairs"; exit 0; fi
          git -C rain-pairs-data -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Satellite against radar pairs, $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push origin rain-pairs && break; sleep 5; done
      # saved only when it changed (after a post): the key is its content, so a quiet run saves nothing
      - uses: actions/cache/save@v6
        if: always() && hashFiles('bot/state/state.json') != ''
        with:
          path: bot/state
          key: nowcast-state-${{ hashFiles('bot/state/state.json') }}
      - name: Hour of the samples
        id: hour
        if: always()
        run: echo "key=radar-samples-$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"
      # once an hour: a key already taken this hour is refused, harmlessly (at most ten minutes of samples wait for the next hour)
      - uses: actions/cache/save@v6
        if: always() && hashFiles('bot/samples/radar-samples.json') != ''
        continue-on-error: true
        with:
          path: bot/samples
          key: ${{ steps.hour.outputs.key }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nowcast-${{ github.run_id }}
          path: bot/out
          retention-days: 3
          if-no-files-found: ignore
