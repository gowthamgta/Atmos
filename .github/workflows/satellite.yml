name: satellite

# Real cloud-top temperatures for the app's 3D clouds (pipeline/satellite_bt.py): every 15 minutes the newest Meteosat SEVIRI Level 1.5
# file of the Indian Ocean service from the EUMETSAT Data Store, its 10.8 and 3.9 um brightness temperatures over India as small PNGs,
# the last hour kept. Published to the `satellite-data` branch as a single commit replaced each run (the repository does not grow);
# the app reads it from raw.githubusercontent.com. Needs the repository secrets EUMETSAT_CONSUMER_KEY and EUMETSAT_CONSUMER_SECRET
# (a free Data Store account); without them each run only says so.
# Himawari-9 (pipeline/himawari_bt.py, NOAA's open copy on AWS, no key) is published beside it in bt-h9/: seen slantwise from 140.7 E,
# parallax-corrected, empty over the west of India; the app uses it where Meteosat's is missing.
on:
  schedule:
    - cron: "4,19,34,49 * * * *"     # a few minutes after each 15-minute scan is complete
  workflow_dispatch:

concurrency:
  group: satellite
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  satellite:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v7
      # the frames published so far (absent on the very first run)
      - name: Published frames
        run: |
          git fetch --depth 1 origin satellite-data && git worktree add bt-site FETCH_HEAD \
            || mkdir -p bt-site
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-satellite.txt
      - run: pip install -r pipeline/requirements-satellite.txt
      - name: Tests
        working-directory: pipeline
        run: python -m pytest -q tests/test_satellite_bt.py tests/test_himawari_bt.py
      - name: Brightness temperatures (Meteosat)
        continue-on-error: true      # Himawari is still published when the Data Store refuses
        working-directory: pipeline
        env:
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
        run: python satellite_bt.py --out ../bt-site
      - name: Brightness temperatures (Himawari-9)
        continue-on-error: true
        working-directory: pipeline
        run: python himawari_bt.py --out ../bt-site
      - name: Publish
        working-directory: bt-site
        run: |
          ls bt*/index.json >/dev/null 2>&1 || { echo "nothing to publish"; exit 0; }
          # a fresh one-commit history each time, so old frames do not pile up in the repository
          tmp=$(mktemp -d)
          cp -r bt* "$tmp/"
          cd "$tmp"
          git init -q -b satellite-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Brightness temperatures $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" satellite-data
