name: nwp

# Fetch the newest runs of each model (ECMWF IFS, NOAA GFS) from Open-Meteo's public data, cut out South India,
# encode them, and deploy the result to GitHub Pages (free, CORS-open). No external storage, no billing.
# Runs hourly: each model exits early when its newest run is not ready, is not one it uses, or is already live.
# A Pages deploy replaces the whole site, so models that were not rebuilt are copied over from the live site.
on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and deploy even if the newest runs are already live"
        type: boolean
        default: false

concurrency:
  group: nwp
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      deploy: ${{ steps.build.outputs.deploy }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Fetch and encode
        id: build
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          base="https://${owner}.github.io/${repo}"
          force="${{ inputs.force && '--force' || '' }}"
          for model in ecmwf_ifs gfs; do
            # one model failing must not stop the other
            python run.py --model "$model" --out site --live-url "$base/$model/latest.json" $force \
              || echo "::warning::$model failed; the live copy stays in place"
          done
          if ls site/*/latest.json >/dev/null 2>&1; then
            python mirror.py --site site --base-url "$base" --models ecmwf_ifs gfs
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.deploy == 'true'
        with:
          path: pipeline/site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
