name: nwp

# Fetch the newest ECMWF IFS 00Z/12Z run, cut out South India, encode and upload to Backblaze B2.
# Open-Meteo finishes each run roughly 7-9 h after the reference time, so we retry hourly;
# the script exits early if the run is not ready or is already published.
on:
  schedule:
    - cron: "30 8-11 * * *"
    - cron: "30 20-23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-publish even if this run is already uploaded"
        type: boolean
        default: false

concurrency:
  group: nwp
  cancel-in-progress: false

jobs:
  ecmwf-ifs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Fetch, encode and publish
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: python run.py --publish ${{ inputs.force && '--force' || '' }}
