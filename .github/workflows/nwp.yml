name: nwp

# Fetch the newest runs of every model listed by `python run.py --list-models` from Open-Meteo's public data (ECMWF IFS for all of
# India, UK Met Office for South India), encode them and deploy the result to GitHub Pages (free, CORS-open).
# Six times a day, at 05:00, 10:00, 13:30, 17:30, 21:00 and 00:00 IST. Each model is built on the four cycles (00Z, 06Z, 12Z, 18Z), which
# Open-Meteo publishes 6 to 7.5 hours after they start, so a scheduled run builds the newest cycle that is surely out by now (one that
# began at least 7 hours ago); a run that finds that cycle already live exits at once. GitHub often starts scheduled jobs an hour or
# more late. A cycle that is late is tried again after 20 minutes, twice at most; any other failure is not retried. A change to the
# pipeline also rebuilds at once.
# A Pages deploy replaces the whole site, so models that were not rebuilt are copied over from the live site.
on:
  schedule:
    # IST is UTC + 5:30. 05:00 IST (23:30 UTC, the 12Z cycle), 10:00 (04:30, 18Z), 13:30 (08:00, 00Z), 17:30 (12:00, 00Z again unless
    # 06Z is early), 21:00 (15:30, 06Z), 00:00 (18:30, 06Z again unless 12Z is early)
    - cron: "30 23,4,15,18 * * *"
    - cron: "0 8,12 * * *"
  # a change to how the models are built rebuilds and deploys at once (on main only: the site is the live one, and GitHub Pages
  # takes deploys from the main branch alone, so a push to another branch would build for nothing and fail to deploy)
  push:
    branches: [main]
    paths:
      - "pipeline/data/**"
      - "pipeline/run.py"
      - "pipeline/fetch_ifs.py"
      - "pipeline/fetch_regular.py"
      - "pipeline/models_regular.py"
      - "pipeline/config.py"
      - "pipeline/derive.py"
      - "pipeline/encode.py"
      - "pipeline/requirements.txt"
      - ".github/workflows/nwp.yml"
      - "pipeline/cyclones.py"
      - "pipeline/ens.py"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and deploy even if the newest runs are already live"
        type: boolean
        default: false

concurrency:
  group: nwp
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      deploy: ${{ steps.build.outputs.deploy }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Fetch and encode
        id: build
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          base="https://${owner}.github.io/${repo}"
          force="${{ inputs.force && '--force' || '' }}"
          models=$(python run.py --list-models)
          # a scheduled run builds the newest cycle (00Z, 06Z, 12Z or 18Z) that began at least 7 hours ago, so it is published by
          # now (4 hours made nearly every run wait, up to 2.5 hours). It is worked out from the clock, not from which cron fired:
          # GitHub often starts a scheduled job an hour or more late, possibly after midnight UTC, and a late start then still
          # asks for a cycle that is out.
          expect=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ref=$(date -u -d '-7 hours' +%Y%m%dT%H)
            h=$(( 10#${ref#*T} ))
            expect="--expect-run ${ref%T*}T$(printf %02d $(( h - h % 6 )))Z"
            echo "waiting for the cycle $expect"
          fi
          pending="$models"
          failed=""
          for attempt in $(seq 1 3); do
            waiting=""
            for model in $pending; do
              # one model failing must not stop the other
              code=0
              python run.py --model "$model" --out site --live-url "$base/$model/latest.json" $force $expect || code=$?
              [ "$code" -eq 0 ] && continue
              if [ "$code" -eq 3 ]; then
                echo "::notice::$model: the cycle is not published yet (attempt $attempt)"
                waiting="$waiting $model"
              elif [ "$attempt" -lt 3 ]; then
                # a failure (a download that broke off, a busy server) is tried again: once it left a model unpublished all day
                echo "::warning::$model failed (exit $code) on attempt $attempt; trying again"
                waiting="$waiting $model"
                failed="$failed $model"
              else
                echo "::warning::$model failed (exit $code) three times; the live copy stays in place"
              fi
            done
            pending="${waiting# }"
            [ -z "$pending" ] && break
            # a late cycle waits 20 minutes; a failure only 5 (and a run started by hand retries failures, not late cycles)
            only_failed=1
            for model in $pending; do case " $failed " in *" $model "*) ;; *) only_failed=0;; esac; done
            if [ "$only_failed" = 1 ]; then sleep 300
            elif [ -z "$expect" ]; then break
            elif [ "$attempt" -lt 3 ]; then sleep 1200
            fi
            failed=""
          done
          for model in $pending; do echo "::warning::$model: the cycle was still not published; the live copy stays in place"; done
          # tropical-cyclone tracks near India (a small JSON file; the live one is kept when there is nothing new)
          python cyclones.py --out site --live-url "$base/cyclones/tracks.json" $force \
            || echo "::warning::cyclones failed; the live file stays in place"
          # the chance of rain from the ECMWF ensemble (a small folder in the same format as a model; the live one is kept when there is nothing new)
          python ens.py --out site --live-url "$base/ens/latest.json" $force             || echo "::warning::ens failed; the live copy stays in place"
          # models that were not rebuilt come over from the live site (always: a deploy replaces the whole site)
          if ! python mirror.py --site site --base-url "$base" --models $models ens; then
            echo "::warning::a live model could not be copied; not deploying, so that it is not dropped from the site"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # the 90 m terrain of India (built once, kept in the repository; see pipeline/build_terrain.py)
          cp -r data/terrain site/terrain
          # deploy when a model was built, or when the terrain on the site differs from the repository's copy
          curl -sf -o live-terrain-index.json "$base/terrain/index.json" || true
          # GitHub Pages takes a site of at most 1 GB: say so plainly when it is over (the deploy may then be refused)
          size=$(du -sb site | cut -f1)
          echo "site size: $size bytes"
          if [ "$size" -gt 1000000000 ]; then echo "::warning::the site is $size bytes, over GitHub Pages' 1 GB: the deploy may be refused"; fi
          if ls site/*/latest.json >/dev/null 2>&1 || ! cmp -s data/terrain/index.json live-terrain-index.json; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@v5
        if: steps.build.outputs.deploy == 'true'
        with:
          path: pipeline/site

  deploy:
    needs: build
    # only main deploys to the live site (a run started by hand on another branch builds, as a check, but does not deploy)
    if: needs.build.outputs.deploy == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
