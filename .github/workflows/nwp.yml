name: nwp

# Fetch the newest ECMWF IFS 00Z/12Z run, cut out South India, encode it, and deploy the result to
# GitHub Pages (free, CORS-open). No external storage, no billing.
# Open-Meteo finishes each run roughly 7-9 h after the reference time, so we retry hourly;
# the script exits early if the run is not ready or is already live.
on:
  schedule:
    - cron: "30 8-11 * * *"
    - cron: "30 20-23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and deploy even if this run is already live"
        type: boolean
        default: false

concurrency:
  group: nwp
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      deploy: ${{ steps.build.outputs.deploy }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Fetch and encode
        id: build
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          python run.py --out site --live-url "https://${owner}.github.io/${repo}/ecmwf_ifs/latest.json" ${{ inputs.force && '--force' || '' }}
          if [ -f site/ecmwf_ifs/latest.json ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; else echo "deploy=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.deploy == 'true'
        with:
          path: pipeline/site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
