name: nwp

# Fetch the newest runs of every model listed by `python run.py --list-models` from Open-Meteo's public data (ECMWF IFS for all of
# India, UK Met Office for South India), encode them and deploy the result to GitHub Pages (free, CORS-open).
# Runs every 30 minutes: each model exits early when its newest run is not ready, is not one it uses, or is already live.
# A Pages deploy replaces the whole site, so models that were not rebuilt are copied over from the live site.
on:
  schedule:
    - cron: "15,45 * * * *"
  # a change to how the models are built rebuilds and deploys at once
  push:
    paths:
      - "pipeline/data/**"
      - "pipeline/run.py"
      - "pipeline/fetch_ifs.py"
      - "pipeline/fetch_regular.py"
      - "pipeline/models_regular.py"
      - "pipeline/config.py"
      - "pipeline/derive.py"
      - "pipeline/encode.py"
      - "pipeline/requirements.txt"
      - "pipeline/cyclones.py"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and deploy even if the newest runs are already live"
        type: boolean
        default: false

concurrency:
  group: nwp
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      deploy: ${{ steps.build.outputs.deploy }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Fetch and encode
        id: build
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          base="https://${owner}.github.io/${repo}"
          force="${{ inputs.force && '--force' || '' }}"
          models=$(python run.py --list-models)
          for model in $models; do
            # one model failing must not stop the other
            python run.py --model "$model" --out site --live-url "$base/$model/latest.json" $force \
              || echo "::warning::$model failed; the live copy stays in place"
          done
          # tropical-cyclone tracks near South India (a small JSON file; the live one is kept when there is nothing new)
          python cyclones.py --out site --live-url "$base/cyclones/tracks.json" $force \
            || echo "::warning::cyclones failed; the live file stays in place"
          if ls site/*/latest.json >/dev/null 2>&1; then
            # models that were not rebuilt come over from the live site
            python mirror.py --site site --base-url "$base" --models $models
            # the 90 m terrain of India (built once, kept in the repository; see pipeline/build_terrain.py)
            cp -r data/terrain site/terrain
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.deploy == 'true'
        with:
          path: pipeline/site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
