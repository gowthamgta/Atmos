name: nwp

# Fetch the newest runs of every model listed by `python run.py --list-models` from Open-Meteo's public data (ECMWF IFS for all of
# India, UK Met Office for South India), encode them and deploy the result to GitHub Pages (free, CORS-open).
# Every 3 hours. Each model is built on all four cycles (00Z, 06Z, 12Z, 18Z), which are published about 6 hours after they start, so a
# scheduled run waits for the newest cycle that is due by now (tries again every 30 minutes, up to six times). A run with nothing
# new exits at once. A change to the pipeline also rebuilds at once.
# A Pages deploy replaces the whole site, so models that were not rebuilt are copied over from the live site.
on:
  schedule:
    - cron: "30 */3 * * *"    # every 3 hours, at 30 minutes past (the 00Z, 06Z, 12Z and 18Z cycles)
  # a change to how the models are built rebuilds and deploys at once
  push:
    paths:
      - "pipeline/data/**"
      - "pipeline/run.py"
      - "pipeline/fetch_ifs.py"
      - "pipeline/fetch_regular.py"
      - "pipeline/models_regular.py"
      - "pipeline/config.py"
      - "pipeline/derive.py"
      - "pipeline/encode.py"
      - "pipeline/requirements.txt"
      - ".github/workflows/nwp.yml"
      - "pipeline/cyclones.py"
      - "pipeline/ens.py"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and deploy even if the newest runs are already live"
        type: boolean
        default: false

concurrency:
  group: nwp
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      deploy: ${{ steps.build.outputs.deploy }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Fetch and encode
        id: build
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          base="https://${owner}.github.io/${repo}"
          force="${{ inputs.force && '--force' || '' }}"
          models=$(python run.py --list-models)
          # a scheduled run waits for the newest cycle (00Z, 06Z, 12Z or 18Z) that began at least 4 hours ago. It is worked out from
          # the clock, not from which cron fired: GitHub often starts a scheduled job hours late, possibly after midnight UTC.
          expect=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ref=$(date -u -d '-4 hours' +%Y%m%dT%H)
            h=$(( 10#${ref#*T} ))
            expect="--expect-run ${ref%T*}T$(printf %02d $(( h - h % 6 )))Z"
            echo "waiting for the cycle $expect"
          fi
          pending="$models"
          for attempt in $(seq 1 6); do
            waiting=""
            for model in $pending; do
              # one model failing must not stop the other
              python run.py --model "$model" --out site --live-url "$base/$model/latest.json" $force $expect && continue
              echo "::notice::$model: attempt $attempt did not complete (run not published yet, or a failure)"
              waiting="$waiting $model"
            done
            pending="${waiting# }"
            [ -z "$pending" ] && break
            [ -z "$expect" ] && break        # not a scheduled run: one try
            sleep 1800        # not published yet: try again in 30 minutes
          done
          for model in $pending; do echo "::warning::$model failed; the live copy stays in place"; done
          # tropical-cyclone tracks near India (a small JSON file; the live one is kept when there is nothing new)
          python cyclones.py --out site --live-url "$base/cyclones/tracks.json" $force \
            || echo "::warning::cyclones failed; the live file stays in place"
          # the chance of rain from the ECMWF ensemble (a small folder in the same format as a model; the live one is kept when there is nothing new)
          python ens.py --out site --live-url "$base/ens/latest.json" $force             || echo "::warning::ens failed; the live copy stays in place"
          # models that were not rebuilt come over from the live site (always: a deploy replaces the whole site)
          if ! python mirror.py --site site --base-url "$base" --models $models ens; then
            echo "::warning::a live model could not be copied; not deploying, so that it is not dropped from the site"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # the 90 m terrain of India (built once, kept in the repository; see pipeline/build_terrain.py)
          cp -r data/terrain site/terrain
          # deploy when a model was built, or when the terrain on the site differs from the repository's copy
          curl -sf -o live-terrain-index.json "$base/terrain/index.json" || true
          if ls site/*/latest.json >/dev/null 2>&1 || ! cmp -s data/terrain/index.json live-terrain-index.json; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.deploy == 'true'
        with:
          path: pipeline/site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
