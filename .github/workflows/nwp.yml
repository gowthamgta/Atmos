name: nwp

# Fetch the newest runs of every model listed by `python run.py --list-models` from Open-Meteo's public data, cut out South India,
# encode them, add the ECMWF-ensemble rain chances (ens.py) and an all-model blend (blend.py), and deploy the result to
# GitHub Pages (free, CORS-open). No external storage, no billing.
# Runs every 30 minutes (the FY-4B satellite pictures are new every 15): each model exits early when its newest run is not ready, is not one it uses, or is already live.
# A Pages deploy replaces the whole site, so models that were not rebuilt are copied over from the live site.
on:
  schedule:
    - cron: "15,45 * * * *"
  # a change to the FY-4B step or to how the IFS run and the blend are built rebuilds and deploys at once
  push:
    paths:
      - "pipeline/fy4.py"
      - "pipeline/data/**"
      - "pipeline/run.py"
      - "pipeline/fetch_ifs.py"
      - "pipeline/blend.py"
      - "pipeline/cyclones.py"
      - "pipeline/microclimate.py"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and deploy even if the newest runs are already live"
        type: boolean
        default: false

concurrency:
  group: nwp
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      deploy: ${{ steps.build.outputs.deploy }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Fetch and encode
        id: build
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          base="https://${owner}.github.io/${repo}"
          force="${{ inputs.force && '--force' || '' }}"
          models=$(python run.py --list-models)
          for model in $models; do
            # one model failing must not stop the other
            python run.py --model "$model" --out site --live-url "$base/$model/latest.json" $force \
              || echo "::warning::$model failed; the live copy stays in place"
          done
          # the ECMWF ensemble: chance of heavy rain in the next 24 h (attached to every model below)
          python ens.py --out site --live-url "$base/ens/latest.json" $force \
            || echo "::warning::ens failed; the live copy stays in place"
          # tropical-cyclone tracks near South India (a small JSON file; the live one is kept when there is nothing new)
          python cyclones.py --out site --live-url "$base/cyclones/tracks.json" $force             || echo "::warning::cyclones failed; the live file stays in place"
          # FY-4B pictures of South India (a new slot every 15 minutes); the live ones are kept when there is nothing new
          python fy4.py --out site --live-url "$base/fy4/latest.json" $force \
            || echo "::warning::fy4 failed; the live pictures stay in place"
          if ls site/*/latest.json >/dev/null 2>&1; then
            # models that were not rebuilt (and the previous ensemble and blend) come over from the live site
            python mirror.py --site site --base-url "$base" --models $models ens blend
            # one forecast from all the models, then the ensemble chances on every model's timeline (the blend included)
            python blend.py --site site --live-url "$base/blend/latest.json" $force \
              || echo "::warning::blend failed; the live copy stays in place"
            python attach.py --site site
            # Tamil Nadu districts: the blend averaged over each district with the heat, rain, sea-breeze and flood indicators
            python microclimate.py --site site --districts ../public/data/south-india-districts.geojson \
              || echo "::warning::microclimate failed; the live file stays in place"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.deploy == 'true'
        with:
          path: pipeline/site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
