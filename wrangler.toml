# Cloudflare (the site since 1 Nov 2026; Netlify still works from netlify.toml): a Worker with static assets, deployed by Cloudflare's build
# with `npm run build` then `npx wrangler deploy`. The built site is served from the assets; worker/index.js runs first only for our functions
# (/api/*, /imd-radar/*), the Netlify functions of netlify/functions/ run through netlify/cloudflare.js.
name = "kralveth-weather"
main = "worker/index.js"
compatibility_date = "2026-10-01"
# the functions use Node's Buffer and zlib (the lightning map's PNG)
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/weather-platform/browser"
binding = "ASSETS"
# a path that is no file is the app's (its own routing reads the address)
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/imd-radar/*"]
