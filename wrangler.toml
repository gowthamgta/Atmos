# Cloudflare Workers (https://weather.kralveth.workers.dev; Cloudflare Pages uses functions/ instead and ignores this file, which has no
# pages_build_output_dir; Netlify still works from netlify.toml): a Worker with static assets, deployed by Cloudflare's build
# with `npm run build` then `npx wrangler deploy`. The built site is served from the assets; worker/index.js runs first only for our functions
# (/api/*, /imd-radar/*), the Netlify functions of netlify/functions/ run through netlify/cloudflare.js.
name = "weather" # the Worker's name in the dashboard: https://weather.kralveth.workers.dev
main = "worker/index.js"
compatibility_date = "2026-10-01"

[assets]
directory = "dist/weather-platform/browser"
binding = "ASSETS"
# a path that is no file is the app's (its own routing reads the address)
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/imd-radar/*"]
