<!-- The map fills the screen; everything else floats over it, as on windy.com -->
<app-map></app-map>

<!-- Top left: search, and the weather of the chosen place -->
<app-place-card></app-place-card>

<!-- Top centre: the name -->
<h1 class="brand">
  <span class="mark" aria-hidden="true"><app-icon name="logo" [size]="16" /></span>
  <span class="brand-name">Atmos<span class="brand-accent">IQ</span></span>
</h1>

<!-- Top right: the menu button, and the layers used most under it -->
<button type="button" class="menu-btn" data-menu-toggle (click)="panels.toggle('menu')" [attr.aria-expanded]="panels.open() === 'menu'" aria-haspopup="dialog" aria-controls="menu-panel" aria-label="Menu: layers, models and settings" title="Menu">
  <app-icon name="menu" [size]="22" />
</button>
@if (panels.open() !== 'menu') {
  <app-layer-rail></app-layer-rail>
}
<!-- the menu and the meteogram are code only needed once they are opened: they load when the browser is idle, after the first picture -->
@defer (on idle) {
  <app-menu-panel></app-menu-panel>
}
<app-about></app-about>

<!-- The observed pictures have their own small panels; a weather station opens its readings -->
<app-radar-panel></app-radar-panel>
<app-satellite-panel></app-satellite-panel>
<app-gibs-panel></app-gibs-panel>
<app-station-card></app-station-card>

<!-- Bottom: the meteogram when it is open, the model button, then the time bar, then the colour bar -->
@defer (on idle) {
  <app-meteogram></app-meteogram>
}
<app-map-controls></app-map-controls>
<app-forecast-timeline></app-forecast-timeline>
<app-forecast-legend></app-forecast-legend>

<!-- The forecast status, when there is something to say -->
@if (catalog.status() === 'loading') {
  <div class="status" role="status"><span class="spinner" aria-hidden="true"></span>Loading forecast…</div>
} @else if (catalog.status() === 'error') {
  <button type="button" class="status error" (click)="retry()" title="The forecast could not be loaded. Click to try again.">
    <app-icon name="alert" [size]="14" />Forecast offline<span class="retry">Retry</span>
  </button>
}
