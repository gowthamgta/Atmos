<!-- Full-screen map background -->
<app-map></app-map>

<!-- Top Navigation & Radar Quick Switcher Bar -->
<header class="top-bar">
  <div class="brand">
    <h1 class="brand-name">
      <span class="brand-icon">⚡</span>
      <span>Atmos</span><span class="brand-accent">IQ</span>
    </h1>
  </div>

  <!-- Radar Product Quick Selector (Mobile & Desktop) -->
  <div class="quick-products-bar glass-panel">
    <button
      class="quick-pill"
      [class.active]="activeProduct() === 'caz'"
      (click)="setProduct('caz')"
      title="Column Maximum Reflectivity (MAX_Z)"
    >
      <span class="pill-dot caz"></span>
      <span class="pill-label">CAZ</span>
    </button>
    <button
      class="quick-pill"
      [class.active]="activeProduct() === 'ppi'"
      (click)="setProduct('ppi')"
      title="Plan Position Indicator (Base Sweep)"
    >
      <span class="pill-dot ppi"></span>
      <span class="pill-label">PPI</span>
    </button>
    <button
      class="quick-pill"
      [class.active]="activeProduct() === 'sri'"
      (click)="setProduct('sri')"
      title="Surface Rainfall Intensity (mm/h)"
    >
      <span class="pill-dot sri"></span>
      <span class="pill-label">SRI</span>
    </button>
    <button
      class="quick-pill"
      [class.active]="activeProduct() === 'pac'"
      (click)="setProduct('pac')"
      title="Precipitation Accumulation (Rain Total)"
    >
      <span class="pill-dot pac"></span>
      <span class="pill-label">PAC</span>
    </button>
  </div>

  <div class="top-actions">
    <!-- Recenter Mosaic -->
    <button class="action-btn recenter-top-btn" (click)="recenter()" title="Recenter Dual Radar Coverage">
      🎯
    </button>

    <!-- Layers & Settings Drawer Toggle -->
    <button
      class="action-btn layers-toggle-btn"
      [class.active]="showLayers()"
      (click)="toggleLayers()"
      title="Radar Settings & Legend"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="12 2 22 8.5 12 15 2 8.5"/>
        <polyline points="2 15.5 12 22 22 15.5"/>
      </svg>
      <span class="badge-dot"></span>
    </button>
  </div>
</header>

<!-- Right drawer: Radar Controls & Legend -->
@if (showLayers()) {
  <aside class="sidebar-right animate-slide-in-right">
    <app-layers></app-layers>
  </aside>
}

<!-- Custom zoom & recenter controls -->
<div class="zoom-controls">
  <button class="zoom-btn" (click)="recenter()" aria-label="Recenter radar" title="Recenter Coverage">
    🎯
  </button>
  <button class="zoom-btn" (click)="zoomIn()" aria-label="Zoom in" title="Zoom in">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>
  <button class="zoom-btn" (click)="zoomOut()" aria-label="Zoom out" title="Zoom out">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>
</div>
