<!-- Full-screen map background -->
<app-map></app-map>

<!-- Forecast: legend, timeline and click card. Radar: its own small panel. The layer menu lives in the header. -->
<app-forecast-legend></app-forecast-legend>
<app-radar-panel></app-radar-panel>
<app-satellite-panel></app-satellite-panel>
<app-gibs-panel></app-gibs-panel>
<app-forecast-timeline></app-forecast-timeline>
<app-forecast-inspector></app-forecast-inspector>

<header class="top-bar">
  <h1 class="brand-name">
    <span class="brand-icon" aria-hidden="true">⚡</span>
    <span>Atmos</span><span class="brand-accent">IQ</span>
  </h1>
  <div class="top-actions">
    <app-layer-menu></app-layer-menu>
    <app-about></app-about>
  </div>
</header>

<!-- Zoom and recenter -->
<div class="zoom-controls">
  <button class="zoom-btn" (click)="recenter()" aria-label="Show all of South India" title="Show all of South India">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
    </svg>
  </button>
  <button class="zoom-btn" (click)="zoomIn()" aria-label="Zoom in" title="Zoom in">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>
  <button class="zoom-btn" (click)="zoomOut()" aria-label="Zoom out" title="Zoom out">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>
</div>
